<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bảng Điểm Sinh Viên</title>
</head>

<body>

    <h2>Bảng Điểm Sinh Viên</h2>

    <label>Họ tên: <input type="text" id="hoTen" /></label>
    <label>Điểm: <input type="number" id="diem" min="0" max="10" step="0.1" /></label>
    <button onclick="them()">Thêm</button>

    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th>Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <p id="thongKe"></p>

    <script>
        const dsinhVien = [];

        function xepLoai(d) {
            if (d >= 8.5) return "Giỏi";
            if (d >= 7.0) return "Khá";
            if (d >= 5.0) return "Trung bình";
            return "Yếu";
        }

        function renderTable() {
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";

            dsinhVien.forEach((sv, i) => {
                const tr = document.createElement("tr");
                if (sv.diem < 5) tr.style.backgroundColor = "yellow";

                tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${sv.hoTen}</td>
          <td>${sv.diem}</td>
          <td>${xepLoai(sv.diem)}</td>
          <td><button data-index="${i}">Xóa</button></td>
        `;
                tbody.appendChild(tr);
            });

            const tong = dsinhVien.length;
            const tb = tong > 0
                ? (dsinhVien.reduce((s, sv) => s + sv.diem, 0) / tong).toFixed(2)
                : 0;
            document.getElementById("thongKe").textContent =
                `Tổng: ${tong} sinh viên | Điểm trung bình: ${tb}`;
        }

        function them() {
            const hoTen = document.getElementById("hoTen").value.trim();
            const diemStr = document.getElementById("diem").value;
            const diem = parseFloat(diemStr);

            if (!hoTen) { alert("Họ tên không được để trống!"); return; }
            if (diemStr === "" || isNaN(diem) || diem < 0 || diem > 10) {
                alert("Điểm phải là số từ 0 đến 10!"); return;
            }

            dsinhVien.push({ hoTen, diem });
            renderTable();

            document.getElementById("hoTen").value = "";
            document.getElementById("diem").value = "";
            document.getElementById("hoTen").focus();
        }

        // Event Delegation để xử lý xóa
        document.getElementById("tbody").addEventListener("click", function (e) {
            if (e.target.tagName === "BUTTON") {
                const index = parseInt(e.target.getAttribute("data-index"));
                dsinhVien.splice(index, 1);
                renderTable();
            }
        });

        // Nhấn Enter ở ô Điểm để thêm
        document.getElementById("diem").addEventListener("keydown", function (e) {
            if (e.key === "Enter") them();
        });

        renderTable();
    </script>

</body>

</html>
