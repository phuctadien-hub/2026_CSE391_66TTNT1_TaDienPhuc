<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhòngKhám Pro — Hệ Thống Quản Lý</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2333;
      --border: rgba(255, 255, 255, 0.07);
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #58a6ff;

      --c1: #3b82f6;
      --c1b: #1e3a5f;
      --c2: #10b981;
      --c2b: #0a3728;
      --c3: #f59e0b;
      --c3b: #3d2c0a;
      --c4: #ef4444;
      --c4b: #3d0f0f;
      --c5: #a855f7;
      --c5b: #2e1550;
      --c6: #06b6d4;
      --c6b: #0a2f38;
      --c7: #ec4899;
      --c7b: #3d0f28;
      --c8: #0ea5e9;
      --c8b: #0a2a3d;
      --c9: #14b8a6;
      --c9b: #0a2e2b;
      --c10: #f97316;
      --c10b: #3d1f0a;
      --c11: #8b5cf6;
      --c11b: #231050;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .logo {
      padding: 28px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .logo-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 8px;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    .nav {
      padding: 12px 0;
      flex: 1;
      overflow-y: auto;
    }

    .nav::-webkit-scrollbar {
      width: 4px;
    }

    .nav::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.06);
      border-left-color: var(--item-color);
    }

    .nav-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      width: 18px;
      letter-spacing: 0.5px;
    }

    .nav-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--item-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .nav-item:hover .nav-icon {
      transform: scale(1.1);
    }

    .nav-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    .nav-item.active .nav-label {
      color: var(--item-color);
    }

    .nav-role {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
      background: var(--item-bg);
      color: var(--item-color);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
    }

    .user-role-badge {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 700;
    }

    .topbar-breadcrumb {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    .topbar-spacer {
      flex: 1;
    }

    .search-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .search-box::placeholder {
      color: var(--muted);
    }

    .notif-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      position: relative;
    }

    .notif-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      border: 1.5px solid var(--surface);
    }

    .content {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
    }

    .content::-webkit-scrollbar {
      width: 6px;
    }

    .content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ── TAB PANELS ── */
    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .panel-icon-big {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 1px solid var(--panel-border);
    }

    .panel-title {
      font-size: 22px;
      font-weight: 800;
    }

    .panel-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── FORM ELEMENTS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1/-1;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    input,
    select,
    textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    select option {
      background: var(--surface2);
    }

    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--panel-color, #3b82f6);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    /* ── TABLE ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-green {
      background: #0a3728;
      color: #10b981;
    }

    .badge-blue {
      background: #1e3a5f;
      color: #3b82f6;
    }

    .badge-red {
      background: #3d0f0f;
      color: #ef4444;
    }

    .badge-yellow {
      background: #3d2c0a;
      color: #f59e0b;
    }

    /* ── STAT CARDS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--scolor);
    }

    .stat-val {
      font-size: 26px;
      font-weight: 800;
      margin: 6px 0 2px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .stat-change {
      font-size: 11px;
      color: #10b981;
      margin-top: 4px;
    }

    /* ── CHART BAR ── */
    .chart-wrap {
      height: 140px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 0 4px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(to top, #3b82f6, #06b6d4);
      transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-height: 4px;
    }

    .bar-label {
      font-size: 10px;
      color: var(--muted);
    }

    /* ── LOGIN ── */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      width: 360px;
      text-align: center;
    }

    .login-logo {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .login-form input,
    .login-form select {
      padding: 11px 14px;
      font-size: 14px;
    }

    .btn-login {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    .btn-login:hover {
      opacity: 0.85;
    }

    /* ── INVOICE ── */
    .invoice-preview {
      background: white;
      border-radius: 12px;
      padding: 30px;
      color: #1a1a1a;
      max-width: 560px;
    }

    .inv-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .inv-title {
      font-size: 22px;
      font-weight: 800;
      color: #1a3c5e;
    }

    .inv-num {
      font-size: 12px;
      color: #6b7a90;
    }

    .inv-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }

    .inv-total {
      display: flex;
      justify-content: space-between;
      padding: 12px 0 0;
      font-weight: 800;
      font-size: 16px;
      color: #1a3c5e;
    }

    /* ── MEDICINE TABLE ── */
    .med-search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .med-search-row input {
      flex: 1;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-title"><span class="logo-dot"></span>PhòngKhám Pro</div>
      <div class="logo-sub">Hệ thống quản lý</div>
    </div>

    <nav class="nav" id="nav">
      <!-- items injected by JS -->
    </nav>

    <div class="sidebar-footer">
      <div class="avatar">NV</div>
      <div>
        <div class="user-name">Nguyễn Văn A</div>
        <div class="user-role-badge">Nhân viên</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <span class="topbar-title" id="topbar-title">Đăng nhập</span>
        <span class="topbar-breadcrumb" id="topbar-bc"></span>
      </div>
      <div class="topbar-spacer"></div>
      <input class="search-box" placeholder="🔍  Tìm kiếm nhanh...">
      <div class="notif-btn">🔔<span class="notif-dot"></span></div>
    </div>

    <div class="content" id="content">
      <!-- panels injected by JS -->
    </div>
  </div>

  <script>
    const tabs = [
      { id: 'login', num: '01', icon: '🔐', label: 'Đăng nhập & Phân quyền', role: 'Tất cả', c: 'var(--c1)', bg: 'var(--c1b)', border: 'rgba(59,130,246,0.2)' },
      { id: 'addpat', num: '02', icon: '➕', label: 'Thêm Bệnh Nhân', role: 'NV', c: 'var(--c2)', bg: 'var(--c2b)', border: 'rgba(16,185,129,0.2)' },
      { id: 'editpat', num: '03', icon: '✏️', label: 'Sửa Thông Tin', role: 'NV', c: 'var(--c3)', bg: 'var(--c3b)', border: 'rgba(245,158,11,0.2)' },
      { id: 'delpat', num: '04', icon: '🗑️', label: 'Xóa Hồ Sơ', role: 'NV', c: 'var(--c4)', bg: 'var(--c4b)', border: 'rgba(239,68,68,0.2)' },
      { id: 'search', num: '05', icon: '🔍', label: 'Tìm Bệnh Nhân', role: 'NV', c: 'var(--c5)', bg: 'var(--c5b)', border: 'rgba(168,85,247,0.2)' },
      { id: 'appt', num: '06', icon: '📅', label: 'Đặt Lịch Khám', role: 'NV', c: 'var(--c6)', bg: 'var(--c6b)', border: 'rgba(6,182,212,0.2)' },
      { id: 'presc', num: '07', icon: '💊', label: 'Kê Đơn Thuốc', role: 'BS', c: 'var(--c7)', bg: 'var(--c7b)', border: 'rgba(236,72,153,0.2)' },
      { id: 'stats', num: '08', icon: '📊', label: 'Thống Kê Lượt Khám', role: 'NV', c: 'var(--c8)', bg: 'var(--c8b)', border: 'rgba(14,165,233,0.2)' },
      { id: 'print', num: '09', icon: '🖨️', label: 'Xuất Phiếu Khám', role: 'NV', c: 'var(--c9)', bg: 'var(--c9b)', border: 'rgba(20,184,166,0.2)' },
      { id: 'pay', num: '10', icon: '💳', label: 'Thanh Toán', role: 'NV', c: 'var(--c10)', bg: 'var(--c10b)', border: 'rgba(249,115,22,0.2)' },
      { id: 'invoice', num: '11', icon: '🧾', label: 'Xuất Hóa Đơn', role: 'NV', c: 'var(--c11)', bg: 'var(--c11b)', border: 'rgba(139,92,246,0.2)' },
    ];

    // Build nav
    const nav = document.getElementById('nav');
    tabs.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'nav-item' + (i === 0 ? ' active' : '');
      el.style.setProperty('--item-color', t.c);
      el.style.setProperty('--item-bg', t.bg);
      el.dataset.id = t.id;
      el.innerHTML = `<span class="nav-num">${t.num}</span>
    <div class="nav-icon">${t.icon}</div>
    <span class="nav-label">${t.label}</span>
    <span class="nav-role">${t.role}</span>`;
      el.onclick = () => activate(t.id, t.label, el);
      nav.appendChild(el);
    });

    function activate(id, label, el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('p-' + id).classList.add('active');
      document.getElementById('topbar-title').textContent = label;
    }

    // Build panels
    const content = document.getElementById('content');

    const panels = {

      login: `
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <div class="login-title">PhòngKhám Pro</div>
    <div class="login-sub">Vui lòng đăng nhập để tiếp tục</div>
    <div class="login-form">
      <div class="form-group">
        <label>TÊN ĐĂNG NHẬP</label>
        <input type="text" placeholder="Nhập tên đăng nhập..." value="nhanvien01">
      </div>
      <div class="form-group">
        <label>MẬT KHẨU</label>
        <input type="password" placeholder="••••••••" value="12345678">
      </div>
      <div class="form-group">
        <label>VAI TRÒ</label>
        <select>
          <option>Nhân viên</option>
          <option>Bác sĩ</option>
          <option>Quản trị viên</option>
        </select>
      </div>
      <button class="btn-login">Đăng nhập →</button>
    </div>
  </div>
</div>`,

      addpat: `
<div class="card" style="--panel-color:var(--c2)">
  <div class="card-title">Thông tin bệnh nhân mới</div>
  <div class="form-grid">
    <div class="form-group"><label>HỌ VÀ TÊN</label><input placeholder="Nguyễn Văn B" value="Trần Thị Mai"></div>
    <div class="form-group"><label>NGÀY SINH</label><input type="date" value="1990-05-15"></div>
    <div class="form-group"><label>GIỚI TÍNH</label><select><option>Nữ</option><option>Nam</option></select></div>
    <div class="form-group"><label>SỐ ĐIỆN THOẠI</label><input placeholder="09xxxxxxxx" value="0901234567"></div>
    <div class="form-group full"><label>ĐỊA CHỈ</label><input placeholder="Số nhà, đường, quận, thành phố" value="123 Trần Hưng Đạo, Q.1, TP.HCM"></div>
